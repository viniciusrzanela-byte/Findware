@if (produto)
{
    <section class="detalhe">
        <div class="foto">
            <img [src]="produto.imagem" [alt]="produto.nome">
        </div>
        <div class="info">
            <h1>{{ produto.nome }}</h1>
            <h2>Sobre o produto:</h2>
            <p>{{ produto.descricao || 'Confira os detalhes e condições da oferta.' }}</p>
            <p class="original">{{ produto.original }}</p>
            <p class="novo">{{ produto.novo }}</p>
            <button class="comprar">Comprar</button>    
        </div>
    </section>
}
@else
{
    <h2>Produto não encontrado.</h2>
}
